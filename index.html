    <!-- OneSignal Push Notifications -->
    <script>
      console.log('🚀 Starting OneSignal setup...');
      
      // Check if we're on HTTPS or localhost
      const isSecure = location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
      console.log('🔒 Secure context:', isSecure, 'Protocol:', location.protocol, 'Hostname:', location.hostname);
      
      if (!isSecure) {
        console.error('❌ OneSignal requires HTTPS or localhost');
        document.getElementById('onesignal-test').innerHTML = 'OneSignal requires HTTPS';
        document.getElementById('onesignal-test').style.background = '#dc3545';
      } else {
        console.log('✅ Secure context detected, loading OneSignal...');
        
        // Try multiple CDN sources for OneSignal SDK
        const cdnSources = [
          'https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js',
          'https://cdn.onesignal.com/sdks/OneSignalSDK.js',
          'https://cdn.onesignal.com/sdks/web/v15/OneSignalSDK.page.js'
        ];
        
        let currentIndex = 0;
        
        function tryLoadOneSignal() {
          if (currentIndex >= cdnSources.length) {
            console.error('❌ All OneSignal CDN sources failed');
            document.getElementById('onesignal-test').innerHTML = 'OneSignal CDN Failed';
            document.getElementById('onesignal-test').style.background = '#dc3545';
            return;
          }
          
          const script = document.createElement('script');
          script.src = cdnSources[currentIndex];
          
          console.log(`🔄 Trying OneSignal CDN ${currentIndex + 1}/${cdnSources.length}: ${cdnSources[currentIndex]}`);
          
          script.onload = function() {
            console.log('✅ OneSignal SDK loaded successfully from:', cdnSources[currentIndex]);
            
            // Initialize OneSignal with proper error handling
            try {
              console.log('🚀 OneSignal SDK ready, initializing...');
              
              // Wait a bit for OneSignal to be fully ready
              setTimeout(function() {
                try {
                  OneSignal.init({
                    appId: "ca7cdcf3-827e-4370-99ee-946690bf535a",
                    promptOptions: {
                      slidedown: {
                        enabled: true,
                        autoPrompt: true,
                        timeDelay: 0,
                        pageViews: 1,
                        actionMessage: "We'd like to show you notifications for the latest updates.",
                        acceptButton: "Allow",
                        cancelButton: "No Thanks"
                      }
                    }
                  });
                  
                  console.log('✅ OneSignal initialized successfully');
                  
                  // Check permission and show prompt after initialization
                  setTimeout(function() {
                    OneSignal.getNotificationPermission().then(function(permission) {
                      console.log('🔔 Permission status:', permission);
                      
                      OneSignal.getUserId().then(function(userId) {
                        console.log('👤 User ID:', userId);
                        
                        if (!userId && permission === 'default') {
                          console.log('📱 Showing prompt...');
                          OneSignal.showNativePrompt().then(function() {
                            console.log('✅ Native prompt shown');
                          }).catch(function(error) {
                            console.error('❌ Native prompt error:', error);
                            // Try alternative methods
                            if (window.Notification && window.Notification.permission === 'default') {
                              console.log('🔄 Trying browser Notification API directly...');
                              window.Notification.requestPermission().then(function(result) {
                                console.log('🔔 Browser permission result:', result);
                              });
                            }
                          });
                        } else if (permission === 'granted') {
                          console.log('✅ Notifications already granted');
                        } else {
                          console.log('ℹ️ Permission status:', permission);
                        }
                      });
                    });
                  }, 1000);
                  
                  // Also try to force prompt after a longer delay
                  setTimeout(function() {
                    if (window.Notification && window.Notification.permission === 'default') {
                      console.log('🔄 Force showing browser permission prompt...');
                      window.Notification.requestPermission().then(function(permission) {
                        console.log('🔔 Force permission result:', permission);
                        if (permission === 'granted') {
                          // Show a test notification
                          new Notification('Notifications Enabled!', {
                            body: 'You will now receive notifications from this site.',
                            icon: '/favicon.ico'
                          });
                        }
                      });
                    }
                  }, 3000);
                  
                } catch (initError) {
                  console.error('❌ OneSignal init error:', initError);
                  // Fall back to native notifications
                  setupNativeNotifications();
                }
              }, 500);
              
            } catch (error) {
              console.error('❌ OneSignal setup error:', error);
              setupNativeNotifications();
            }
          };
          
          script.onerror = function() {
            console.error(`❌ Failed to load OneSignal SDK from: ${cdnSources[currentIndex]}`);
            currentIndex++;
            if (currentIndex < cdnSources.length) {
              setTimeout(tryLoadOneSignal, 1000); // Try next CDN after 1 second
            } else {
              // All CDNs failed, try native notifications as fallback
              console.log('🔄 All OneSignal CDNs failed, trying native notifications...');
              setupNativeNotifications();
            }
          };
          
          document.head.appendChild(script);
        }
        
        tryLoadOneSignal();
        
        // Fallback to native notifications if OneSignal fails
        function setupNativeNotifications() {
          console.log('🔔 Setting up native notifications fallback...');
          
          if ('Notification' in window) {
            console.log('✅ Native notifications supported');
            
            // Create a mock OneSignal object for compatibility
            window.OneSignal = {
              getNotificationPermission: function() {
                return Promise.resolve(Notification.permission);
              },
              getUserId: function() {
                return Promise.resolve(null);
              },
              showNativePrompt: function() {
                return Notification.requestPermission();
              },
              init: function() {
                console.log('🔔 Native notifications initialized');
                
                // Auto-request permission
                if (Notification.permission === 'default') {
                  setTimeout(function() {
                    Notification.requestPermission().then(function(permission) {
                      console.log('🔔 Native permission result:', permission);
                      if (permission === 'granted') {
                        // Show a test notification
                        new Notification('Notifications Enabled!', {
                          body: 'You will now receive notifications from this site.',
                          icon: '/favicon.ico'
                        });
                      }
                    });
                  }, 2000);
                }
              }
            };
            
            // Initialize native notifications
            window.OneSignal.init();
            
            document.getElementById('onesignal-test').innerHTML = 'Native Notifications';
            document.getElementById('onesignal-test').style.background = '#17a2b8';
            
          } else {
            console.error('❌ Native notifications not supported');
            document.getElementById('onesignal-test').innerHTML = 'No Notifications';
            document.getElementById('onesignal-test').style.background = '#6c757d';
          }
        }
      }
    </script>
